name: SonarCloud Code Analysis

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd hou/cangchu
          mvn -B compile -DskipTests \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=wlwlwlwl57_cangchu_1 \
            -Dsonar.organization=wlwlwlwl57 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.exclusions=**/target/**,**/build/**,**/node_modules/**,**/.idea/**,**/.vscode/**,**/*.log,**/*.tmp,**/mvw*,**/package-lock.json,**/.mvn/**,**/dist/** \
            -Dsonar.coverage.exclusions=**/dto/**,**/entity/**,**/CangchuApplication.java,**/repository/**,**/exception/**
